spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:mentesvivas}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
app.jwt.refresh-token-expiration=${JWT_SESSION_EXPIRATION:1h}

app.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}
