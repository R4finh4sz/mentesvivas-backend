spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:mentesvivas}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
app.jwt.refresh-token-expiration=${JWT_SESSION_EXPIRATION:1h}

app.login.max-attempts=5
app.login.attempts-window=${LOGIN_ATTEMPTS_WINDOW:15m}
app.login.lockout-duration=${LOGIN_LOCKOUT_DURATION:15m}

app.recovery.code-validity=${RECOVERY_CODE_VALIDITY:30m}
app.recovery.max-attempts=${RECOVERY_MAX_ATTEMPTS:5}
app.recovery.max-sends=${RECOVERY_MAX_SENDS:3}
app.recovery.sends-window=${RECOVERY_SENDS_WINDOW:1h}

app.email-confirmation.code-validity=${EMAIL_CONFIRMATION_CODE_VALIDITY:30m}
app.email-confirmation.max-attempts=${EMAIL_CONFIRMATION_MAX_ATTEMPTS:5}
app.email-confirmation.max-sends=${EMAIL_CONFIRMATION_MAX_SENDS:3}
app.email-confirmation.sends-window=${EMAIL_CONFIRMATION_SENDS_WINDOW:1h}

app.two-factor.code-validity=${TWO_FACTOR_CODE_VALIDITY:10m}
app.two-factor.max-attempts=${TWO_FACTOR_MAX_ATTEMPTS:5}
app.two-factor.max-sends=${TWO_FACTOR_MAX_SENDS:5}
app.two-factor.sends-window=${TWO_FACTOR_SENDS_WINDOW:1h}

app.cep.base-url=${CEP_BASE_URL:https://viacep.com.br/ws}
app.cep.timeout=${CEP_TIMEOUT:3s}

app.email.api-key=${RESEND_API_KEY:}
app.email.from-address=${EMAIL_FROM_ADDRESS:MentesVivas <onboarding@resend.dev>}

app.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.measurements.weight.expected-min=${WEIGHT_EXPECTED_MIN:30}
app.measurements.weight.expected-max=${WEIGHT_EXPECTED_MAX:300}
app.measurements.weight.possible-min=${WEIGHT_POSSIBLE_MIN:10}
app.measurements.weight.possible-max=${WEIGHT_POSSIBLE_MAX:500}
app.measurements.height.expected-min=${HEIGHT_EXPECTED_MIN:1.20}
app.measurements.height.expected-max=${HEIGHT_EXPECTED_MAX:2.30}
app.measurements.height.possible-min=${HEIGHT_POSSIBLE_MIN:0.50}
app.measurements.height.possible-max=${HEIGHT_POSSIBLE_MAX:2.80}
