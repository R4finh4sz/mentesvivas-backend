spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:mentesvivas}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
app.jwt.refresh-token-expiration=${JWT_SESSION_EXPIRATION:1h}

app.login.max-attempts=5
app.login.attempts-window=${LOGIN_ATTEMPTS_WINDOW:15m}
app.login.lockout-duration=${LOGIN_LOCKOUT_DURATION:15m}

app.recovery.code-validity=${RECOVERY_CODE_VALIDITY:30m}
app.recovery.max-attempts=${RECOVERY_MAX_ATTEMPTS:5}
app.recovery.max-sends=${RECOVERY_MAX_SENDS:3}
app.recovery.sends-window=${RECOVERY_SENDS_WINDOW:1h}

app.email-confirmation.code-validity=${EMAIL_CONFIRMATION_CODE_VALIDITY:30m}
app.email-confirmation.max-attempts=${EMAIL_CONFIRMATION_MAX_ATTEMPTS:5}
app.email-confirmation.max-sends=${EMAIL_CONFIRMATION_MAX_SENDS:3}
app.email-confirmation.sends-window=${EMAIL_CONFIRMATION_SENDS_WINDOW:1h}

app.two-factor.code-validity=${TWO_FACTOR_CODE_VALIDITY:10m}
app.two-factor.max-attempts=${TWO_FACTOR_MAX_ATTEMPTS:5}
app.two-factor.max-sends=${TWO_FACTOR_MAX_SENDS:3}
app.two-factor.sends-window=${TWO_FACTOR_SENDS_WINDOW:15m}

app.cep.base-url=${CEP_BASE_URL:https://viacep.com.br/ws}
app.cep.timeout=${CEP_TIMEOUT:3s}

app.email.api-key=${RESEND_API_KEY:}
app.email.from-address=${EMAIL_FROM_ADDRESS:MentesVivas <onboarding@resend.dev>}

app.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

app.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
app.mfa.issuer=${MFA_ISSUER:MentesVivas}

app.vital-signs.systolic.min=${VITAL_SYSTOLIC_MIN:40}
app.vital-signs.systolic.max=${VITAL_SYSTOLIC_MAX:300}
app.vital-signs.diastolic.min=${VITAL_DIASTOLIC_MIN:20}
app.vital-signs.diastolic.max=${VITAL_DIASTOLIC_MAX:200}
app.vital-signs.heart-rate.min=${VITAL_HEART_RATE_MIN:20}
app.vital-signs.heart-rate.max=${VITAL_HEART_RATE_MAX:300}
app.vital-signs.glucose.min=${VITAL_GLUCOSE_MIN:10}
app.vital-signs.glucose.max=${VITAL_GLUCOSE_MAX:1500}
app.vital-signs.temperature.min=${VITAL_TEMPERATURE_MIN:25}
app.vital-signs.temperature.max=${VITAL_TEMPERATURE_MAX:45}
app.vital-signs.oxygen-saturation.min=${VITAL_OXYGEN_MIN:30}
app.vital-signs.oxygen-saturation.max=${VITAL_OXYGEN_MAX:100}

app.hydration.ml-per-kg-min=${HYDRATION_ML_PER_KG_MIN:25}
app.hydration.ml-per-kg-max=${HYDRATION_ML_PER_KG_MAX:30}
app.hydration.zone=${HYDRATION_ZONE:America/Sao_Paulo}
app.hydration.renal-keywords=${HYDRATION_RENAL_KEYWORDS:renal,rim,rins,nefro,dialise}
app.hydration.cardiac-keywords=${HYDRATION_CARDIAC_KEYWORDS:cardi,coracao,miocard,infarto}
app.hydration.consult-keywords=${HYDRATION_CONSULT_KEYWORDS:hipertens,pressao alta,diabet}

app.timeline.default-days=${TIMELINE_DEFAULT_DAYS:7}
app.timeline.max-days=${TIMELINE_MAX_DAYS:90}
