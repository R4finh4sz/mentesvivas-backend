spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:mentesvivas}
app.jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:30m}
app.jwt.refresh-token-expiration=${JWT_SESSION_EXPIRATION:1h}

app.login.max-tentativas=5
app.login.janela-tentativas=${LOGIN_JANELA_TENTATIVAS:15m}
app.login.duracao-bloqueio=${LOGIN_DURACAO_BLOQUEIO:15m}

app.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}
